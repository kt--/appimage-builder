name: Run tests

on:
  workflow_call:
env:
  APPIMAGE_BUILDER_REMOTE_REPO_OWNER: ${{ github.repository_owner }}
  PYTHONBREAKPOINT: 0

jobs:
  pytest-ubuntu-container:
    name: Run tests on Ubuntu 26.04 (Docker)
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        run: |
          apt-get -y update
          apt-get install -y fakeroot lsb-release binutils patchelf git python3-dev python3-pip python3-venv libffi-dev
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up a virtualenv
        run: |
          python3 -m venv .venv
      - name: Install appimage-builder and run tests
        run: |
          git config --global --add safe.directory $PWD
          . .venv/bin/activate
          pip install pytest
          pip install -e .[dev]
          pytest tests

  pytest-archlinux:
    name: Run tests on ArchLinux (Docker)
    runs-on: ubuntu-26.04
    container: archlinux
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm binutils fakeroot lsb-release strace patchelf git python-pip gcc
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up a virtualenv
        run: |
          python3 -m venv .venv
      - name: Install appimage-builder and run tests
        run: |
          git config --global --add safe.directory $PWD
          . .venv/bin/activate
          pip install pytest
          pip install -e .[dev]
          pytest tests

  pytest-ubuntu-runner:
    name: Run tests on Ubuntu 26.04 with python 3.14.
    runs-on: ubuntu-26.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get install -y fakeroot lsb-release binutils patchelf git libffi-dev
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Clear Python cache
        run: |
          sudo rm -rf /__t/Python
      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install appimage-builder and run tests
        run: |
          pip install pytest
          pip install -e .[dev]
          python3 -m pytest tests

  build-pack-bash:
    runs-on: ubuntu-26.04
    needs: [ pytest-ubuntu-container, pytest-ubuntu-runner, pytest-archlinux ]
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rust-coreutils- coreutils-from-uutils- gnu-coreutils coreutils-from-gnu --auto-remove --allow-remove-essential
          sudo apt-get install -y patchelf desktop-file-utils libgdk-pixbuf-2.0-dev fakeroot findutils strace git lsb-release python3-build python3-setuptools adwaita-icon-theme libffi-dev

          sudo wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Python matches the recipes' Ubuntu release
        # The AppImage bundles python<X.Y>-minimal from the recipe's Ubuntu release, where X.Y is the
        # version of the python3 running this job, and pip-installs compiled modules built for X.Y into it.
        # So the runner's release, the recipes' release and python3 must all agree (24.04 -> 3.12, 26.04 -> 3.14).
        run: |
          cd ${{ github.workspace }}/recipes/appimage-builder
          py=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          runner=$(lsb_release -cs)
          echo "Runner release: $runner, build python3: $py ($(command -v python3))"
          for recipe in AppImageBuilder.yml AppImageBuilder-debug.yml; do
            for suite in $(grep -oP '^\s*-\s*sourceline:.*\bdeb\s+(\[[^]]*\]\s+)?\S+\s+\K[a-z]+' "$recipe" | sort -u); do
              if [ "$suite" != "$runner" ]; then
                echo "::error file=recipes/appimage-builder/$recipe::Recipe uses Ubuntu '$suite' but the runner is '$runner'; they must match so python3 matches the bundled Python"
                exit 1
              fi
            done
          done
          if ! apt-cache show "python${py}-minimal" > /dev/null 2>&1; then
            echo "::error::python${py}-minimal is not available in '$runner'; build with that release's system python3 instead of python ${py}"
            exit 1
          fi
          echo "OK: python${py}-minimal is available in '$runner'"
      - name: Build Python Wheel
        run: |
          cd ${{ github.workspace }}
          python3 -m build
      - name: Install appimage-builder
        run: |
          pip install --ignore-installed --user --break-system-packages .
      - name: Build AppImage
        run: |
          cd ${{ github.workspace }}/recipes/appimage-builder
          export APPIMAGE_BUILDER_VERSION=$(appimage-builder --version | head -1 | cut -f 2 -d" ")
          echo "APPIMAGE_BUILDER_VERSION=${APPIMAGE_BUILDER_VERSION}" >> $GITHUB_ENV
          appimage-builder --log DEBUG --skip-test
      - name: Pack bash
        run: |
          # build bash
          BUILDER_PATH=$(find $PWD -name appimage-builder-*.AppImage)
          chmod +x "$BUILDER_PATH"
          cd ${{ github.workspace }}/recipes/bash/
          "$BUILDER_PATH" --appimage-extract
          find ./squashfs-root -name mksquashfs -ls -exec ldd {} \; -exec readelf -p .interp {} \;
          sudo strace -f -v -e openat ./squashfs-root/AppRun --log DEBUG --skip-test
      - name: Test bash
        run: |
          cd ${{ github.workspace }}/recipes/bash/
          ./bash*.AppImage --appimage-extract-and-run -c "echo Hello World"
      - name: Build AppImage (DEBUG runtime)
        run: |
          cd ${{ github.workspace }}/recipes/appimage-builder
          appimage-builder --skip-test --recipe ./AppImageBuilder-debug.yml
      - name: Compress Assets
        run: |
          cd ${{ github.workspace }}/recipes/appimage-builder
          tar -cvf appimage-builder_x86_64-AppImage.tar -C ${{ github.workspace }}/recipes/appimage-builder/ *x86_64.AppImage*
          tar -cvf appimage-builder_x86_64-AppImage-DEBUG.tar -C ${{ github.workspace }}/recipes/appimage-builder/ *-DEBUG.AppImage*
          tar -cvf ${{ github.workspace }}/appimage-builder_python-dist.tar -C ${{ github.workspace }}/dist .
      - name: Upload AppImageBuilder AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage-builder.AppImage
          path: '${{ github.workspace }}/recipes/appimage-builder/appimage-builder_x86_64-AppImage.tar'
          retention-days: 7
      - name: Upload AppImageBuilder Debug AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage-builder-DEBUG.AppImage
          path: '${{ github.workspace }}/recipes/appimage-builder/appimage-builder_x86_64-AppImage-DEBUG.tar'
          retention-days: 7
      - name: Upload AppImageBuilder Python dist
        uses: actions/upload-artifact@v7
        with:
          name: appimage-builder-pydist
          path: '${{ github.workspace }}/appimage-builder_python-dist.tar'
          retention-days: 7
      - name: Upload Bash AppImage
        uses: actions/upload-artifact@v7
        with:
          name: bash.AppImage
          path: '${{ github.workspace }}/recipes/bash/*.AppImage*'
          retention-days: 7
